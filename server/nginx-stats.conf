#
# Paste inside the server { } block that serves the dashboard.
# Same origin as the page, so the widget needs no CORS headers.

location = /stats.json {
	alias /run/b3rry-stats/stats.json;
	default_type application/json;
	add_header Cache-Control "no-store" always;

	# Server stats are not for the public: allow only your VPN and LAN
	allow 10.8.0.0/24;     # WireGuard - change to your subnet
	allow 192.168.1.0/24;  # LAN - change to your subnet
	deny all;
}
